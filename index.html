<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>연원마을 현대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#a9d6ee; --panel:#fffaf0; --panel2:#fff0c9; --ink:#4a3428; --line:rgba(74,52,40,.14);
  --muted:#8b6f5c; --hi:#ffd23f; --shadow:0 6px 18px rgba(60,40,20,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1c2452; --panel:#2f2940; --panel2:#3d3553; --ink:#fff1d6; --line:rgba(255,255,255,.12); --muted:#c7b59c; --shadow:0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --sky:#1c2452; --panel:#2f2940; --panel2:#3d3553; --ink:#fff1d6; --line:rgba(255,255,255,.12); --muted:#c7b59c; --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars{position:absolute;inset:0;opacity:0}
#clouds{position:absolute;inset:0}
#clouds i{position:absolute;display:block;width:110px;height:34px;border-radius:40px;background:#fff;opacity:.95;animation:drift 90s linear infinite}
#clouds i::before,#clouds i::after{content:"";position:absolute;background:#fff;border-radius:50%}
#clouds i::before{width:48px;height:48px;left:16px;top:-24px}
#clouds i::after{width:36px;height:36px;left:54px;top:-16px}
#clouds i:nth-child(1){top:6%;left:8%}
#clouds i:nth-child(2){top:14%;left:40%;transform:scale(.7);animation-duration:120s}
#clouds i:nth-child(3){top:4%;left:65%;transform:scale(1.2);animation-duration:100s}
#clouds i:nth-child(4){top:18%;left:85%;transform:scale(.8);animation-duration:140s}
@keyframes drift{from{translate:-30vw 0}to{translate:30vw 0}}
#stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff6c8;box-shadow:0 0 6px #fff6c8;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
#orbs{position:fixed;inset:0;z-index:3;pointer-events:none}
#sun,#moon{position:absolute;top:26px;right:90px;width:52px;height:52px;border:0;padding:0;border-radius:50%;cursor:pointer;pointer-events:auto;transition:transform .6s}
#sun{background:radial-gradient(circle at 38% 35%,#fff3a0,#ffd23f 55%,#ffb12b);box-shadow:0 0 0 8px rgba(255,210,63,.25),0 0 30px rgba(255,190,60,.6)}
#moon{background:radial-gradient(circle at 35% 35%,#fffbe6,#f4e6a8);box-shadow:inset -10px -4px 0 rgba(200,180,110,.45),0 0 24px rgba(255,246,200,.5);opacity:0;pointer-events:none}
#sun.spin{transform:rotate(360deg) scale(1.3)}
#toast{position:fixed;z-index:6;left:50%;top:70px;transform:translate(-50%,-20px);padding:9px 18px 7px;font-size:18px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.shoot{position:fixed;z-index:3;top:40px;left:20%;width:140px;height:3px;border-radius:3px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff6c8);transform:rotate(20deg);animation:shoot 1.3s ease-in forwards}
@keyframes shoot{from{translate:0 0;opacity:1}to{translate:520px 190px;opacity:0}}
#eggs{color:var(--muted)}
#hintModal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(30,24,40,.4);padding:16px}
#hintModal[hidden]{display:none}
#hintModal .card{width:min(420px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px 20px}
#hintModal h2{margin:0;font-size:22px;font-weight:normal}
#hintModal .sub{margin:2px 0 12px;color:var(--muted);font-size:14px}
#hintList{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#hintList li{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:14px;padding:9px 12px 7px;font-size:15px;line-height:1.45}
#hintList li b{font-weight:normal;font-size:20px;line-height:1.1}
#hintList li.done{opacity:.7}
#hintList li.done span::after{content:" ✅";}
#hintClose{margin-top:14px;width:100%;font:inherit;font-size:16px;color:#4a3428;background:var(--hi);border:0;border-radius:14px;box-shadow:0 3px 0 #e0a800;padding:8px 0 6px;cursor:pointer}
canvas#scene{position:fixed;left:0;top:0;z-index:1;display:block;touch-action:none;width:100%;height:100%}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;letter-spacing:.2px;
  background:rgba(52,38,30,.72);color:#fff;border-radius:6px;padding:2px 7px 0;opacity:.95}
.tag.on{background:var(--hi);color:#4a3428;font-size:14px;opacity:1;z-index:2;box-shadow:0 2px 6px rgba(60,40,20,.25)}
.tag.bld{font-size:13px;border:0;background:var(--panel);border-radius:999px;padding:3px 10px 1px;box-shadow:0 2px 6px rgba(60,40,20,.18);opacity:.9;pointer-events:auto;cursor:pointer;font-family:inherit;color:var(--ink)}
.tag.place{font-size:12px;opacity:.9;background:var(--panel2);color:var(--ink);border-radius:999px;padding:3px 10px 1px}
.facade{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#fff;border:0;border-radius:.4em;padding:.1em .55em 0;
  font-family:inherit;line-height:1.25;cursor:pointer;pointer-events:auto;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.tag.bld:hover{background:var(--panel2);opacity:1}
.sign{position:absolute;transform:translate(-50%,calc(-100% - 8px));white-space:nowrap;font-size:13px;line-height:1;
  padding:5px 9px 3px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:#9b6b45}
.sign.hyundai{background:#0a2e6b;color:#fff}
.sign.samsung{background:#1428a0;color:#fff}
.sign.racer{background:#e63946;color:#fff}
.sign.saemaul{background:#2f8f46;color:#fff}
.sign.soccer{background:#fff;color:#1b4fa0;border:2px solid #1b4fa0}
.sign.sticker{background:#ffe600;color:#1a1a1a;border-radius:4px;transform:translate(-50%,-55%) rotate(-9deg);font-size:12px}
.sign.sticker::after{display:none}
.bubble{position:absolute;transform:translate(-50%,calc(-100% - 34px));white-space:nowrap;font-size:16px;
  background:#fff;color:#4a3428;border:3px solid #ffb400;border-radius:20px;padding:5px 13px 3px;display:none;z-index:3;
  box-shadow:0 4px 0 rgba(255,180,0,.35);transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-9px;width:0;height:0;
  border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #ffb400}
.bubble.show{display:block;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{scale:.4;opacity:0}to{scale:1;opacity:1}}

.fx{position:absolute;transform:translate(-50%,-50%);font-size:20px;text-shadow:0 1px 3px rgba(255,255,255,.9)}

.box{background:var(--panel);border-radius:18px;box-shadow:var(--shadow)}
.ui{position:fixed;z-index:4}
#panel{top:12px;left:12px;width:236px;max-height:calc(100% - 24px);overflow:auto;padding:6px}
#panel.closed{width:auto}
#toggle{font:inherit;font-size:16px;color:var(--ink);background:none;border:0;padding:5px 8px 3px;cursor:pointer;width:100%;text-align:left}
#toggle span{color:var(--muted);font-size:13px;margin-left:4px}
#panel .body{padding:0 8px 8px}
#panel.closed .body{display:none}
#panel .sub{margin:4px 0 6px;font-size:13px;color:var(--muted);line-height:1.45}
.fam{margin-top:10px}
.fam h2{margin:0 0 5px;font-size:15px;font-weight:normal}
.fam h2 button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px}
.fam h2 i{display:inline-block;width:12px;height:12px;border-radius:50%}
.fam h2 span{font-size:12px;color:var(--muted)}
.members{display:flex;flex-wrap:wrap;gap:5px}
.members button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);border:0;border-radius:999px;
  padding:4px 10px 2px;cursor:pointer;transition:transform .15s}
.members button:hover{transform:translateY(-1px)}
.members button.on{background:var(--hi);color:#4a3428}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

#help{left:12px;bottom:12px;padding:8px 14px 6px;font-size:13px;line-height:1.55}
#help kbd{font:inherit;background:var(--panel2);border-radius:6px;padding:0 5px;margin:0 1px}
#now{font-size:16px}
#now span{background:var(--hi);color:#4a3428;padding:0 7px;border-radius:999px}

#tools{top:12px;right:12px;display:flex;flex-direction:column;gap:8px}
#tools button{font:inherit;font-size:20px;width:46px;height:46px;color:var(--ink);background:var(--panel);
  border:0;border-radius:50%;box-shadow:var(--shadow);cursor:pointer;touch-action:none;padding:0;transition:transform .15s}
#tools button:hover{transform:scale(1.06)}
#tools button.off{opacity:.55}
#joy{position:fixed;z-index:5;width:120px;height:120px;margin:-60px 0 0 -60px;display:none;pointer-events:none;
  border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(0,0,0,.15)}
#joy.on{display:block}
#knob{position:absolute;left:36px;top:36px;width:42px;height:42px;border-radius:50%;background:var(--hi);box-shadow:0 3px 8px rgba(0,0,0,.25)}
#help .touch{display:none}
#jumpBtn{right:24px;bottom:24px;width:66px;height:66px;display:none;font:inherit;font-size:16px;border-radius:50%;
  background:var(--hi);color:#4a3428;border:0;box-shadow:0 4px 0 #e0a800,var(--shadow);touch-action:none}
@media (pointer:coarse){ #jumpBtn{display:block} #help .keys{display:none} #help .touch{display:block} }
@media (max-width:640px){
  #panel:not(.closed){right:70px;width:auto;max-height:50%}
  #help{bottom:12px;font-size:12px;padding:6px 10px 4px;max-width:calc(100% - 110px)}
  #now{font-size:14px}
  #jumpBtn{right:16px;bottom:16px}
  #tools button{width:40px;height:40px;font-size:17px}
  #sun,#moon{right:64px;top:14px;width:38px;height:38px}
  .tag{font-size:11px;padding:2px 7px 0}
  .tag.on{font-size:13px}
  .tag.bld{font-size:11px}
  .tag.place{font-size:10px}
  .sign{font-size:11px;padding:4px 6px 2px}
  .bubble{font-size:14px;padding:4px 10px 2px}
  #toast{font-size:14px;top:60px;white-space:normal;width:max-content;max-width:calc(100% - 40px);text-align:center}
}
@media (prefers-reduced-motion: reduce){ #stars i,#clouds i{animation:none} }
#loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;font-size:22px;background:var(--sky)}
</style>
</head>
<body>
<div id="sky"><div id="clouds"><i></i><i></i><i></i><i></i></div><div id="stars"></div></div>
<div id="orbs"><button id="sun" aria-label="해"></button><button id="moon" aria-label="달" tabindex="-1"></button></div>
<div id="toast" class="box" role="status"></div>
<div id="hintModal" role="dialog" aria-modal="true" aria-labelledby="hintTitle" hidden>
  <div class="card box">
    <h2 id="hintTitle">숨은 재미 힌트</h2>
    <p class="sub" id="hintCount"></p>
    <ul id="hintList"></ul>
    <button id="hintClose">닫기</button>
  </div>
</div>
<canvas id="scene"></canvas>
<div id="labels"></div>
<div id="loading">연원마을을 짓는 중…</div>

<div id="panel" class="box ui closed">
  <button id="toggle" aria-expanded="false">🏠 연원마을 현대<span>▾ 펼치기</span></button>
  <div class="body">
    <p class="sub">캐릭터를 누르면 그 사람을 움직여요.<br>아파트를 누르면 그 동 가족이 손을 흔들어요.<br>아이를 놀이터의 그네나 시소로 데려가면 탈 수 있어요.</p>
    <div class="fams" id="fams"></div>
  </div>
</div>

<div id="help" class="box ui">
  <div id="now">지금 움직이는 사람 <span>재윤</span></div>
  <div class="keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 이동 &nbsp; <kbd>Space</kbd> 점프 &nbsp; <kbd>Tab</kbd> 다음 사람 &nbsp; <kbd>N</kbd> 낮/밤 &nbsp; 화면 끌기로도 이동</div>
  <div class="touch">끌어서 이동 · 두 손가락 확대</div>
  <div id="eggs">🥚 숨은 재미를 찾아보세요 0/7</div>
</div>

<div id="tools" class="ui">
  <button id="zin" aria-label="확대" title="확대">+</button>
  <button id="zout" aria-label="축소" title="축소">−</button>
  <button id="dayBtn" aria-label="밤으로 바꾸기" title="낮/밤 바꾸기">🌙</button>
  <button id="musicBtn" aria-label="음악 끄기" title="배경음 켜기/끄기">🔊</button>
  <button id="partyBtn" aria-label="댄스 파티" title="댄스 파티">🎉</button>
  <button id="hintBtn" aria-label="숨은 재미 힌트" title="숨은 재미 힌트">💡</button>
  <button id="resetBtn" aria-label="처음 자리로" title="처음 자리로">🔄</button>
</div>

<div id="joy"><div id="knob"></div></div>
<button id="jumpBtn" class="ui">점프</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
const CHAR = 3.5;             // 캐릭터 크기
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 캐릭터 옵션
   age: adult / kid / toddler, hair: short|long|bob|ponytail|pigtailsUp|oneTail
   sign: 머리 위 글씨, cat: 머리 위 고양이 색, racer: 모터보트 선수, chubby, big, stripes, dress, skin */
const FAMILIES = [
  { dong:'102', name:'재윤이네', color:'#5b8def', wall:'#fdf3e1', pos:[-34.5,-12.5], rot:0, members:[
    { label:'재윤이 아빠', role:'dad', soccer:true, shirt:0x1f5fbf, pants:0xffffff, hair:'crew', hairColor:0x2b1d14, sign:{text:'현대', cls:'hyundai'}, sign2:{text:'⚽ 열혈 축구팬', cls:'soccer'}, tapLine:'골~~~!! ⚽', waveLine:'오늘 축구 보러 가요! ⚽' },
    { label:'재윤이 엄마', role:'mom', shirt:0xa7c7ff, pants:0xa7c7ff, hair:'bun', hairColor:0x5a3825, sign:{text:'삼성', cls:'samsung'} },
    { label:'재윤', name:'재윤', role:'son', age:'toddler', chubby:true, hair:0x2b1d14,
      shirt:0x4a78d6, stripes:['#4a78d6','#ffffff'], pantStripes:['#2f3a55','#9fc3ff'] } ]},
  { dong:'103', name:'채이네', color:'#ff7aa8', wall:'#fff0f4', pos:[-11.5,-12.5], rot:0, members:[
    { label:'채이 아빠', role:'dad', racer:true, shirt:0xe63946, pants:0xe63946, hair:0x1f1a1a, sign:{text:'🚤 모터보트 선수', cls:'racer'} },
    { label:'채이 엄마', role:'mom', hair:'bob', hairColor:0x3b2418, shirt:0xffb3cf, pants:0xffb3cf, sign:{text:'초보운전', cls:'sticker'}, sticker:true },
    { label:'채이', name:'채이', role:'daughter', age:'toddler', hair:'pigtailsUp', hairColor:0x3b2418, shirt:0xff8fb8, pants:0xff8fb8 } ]},
  { dong:'104', name:'서현이네', color:'#4cbf7a', wall:'#eefaf0', pos:[11.5,-12.5], rot:0, members:[
    { label:'서현이 아빠', role:'dad', big:true, shirt:0x3fa66a, pants:0x2e3b33, hair:0x2b1d14, sign:{text:'삼성', cls:'samsung'} },
    { label:'서현이 엄마', role:'mom', hair:'ponytail', hairColor:0x3a2418, face:'smile', shirt:0x9be0b2, pants:0x9be0b2 },
    { label:'태현', name:'태현', role:'son', age:'kid', face:'grin', shirt:0x9be34a, pants:0x4a4f6b, hair:0x2b1d14 },
    { label:'서현', name:'서현', role:'daughter', age:'toddler', hair:'oneTail', pin:true, hairColor:0x4a2c1c, dress:true, shirt:0xffe066, pants:0xffe066 } ]},
  { dong:'107', name:'유담이네', color:'#ff9f43', wall:'#fff4e6', pos:[34.5,-12.5], rot:0, members:[
    { label:'유담이 아빠', role:'dad', shirt:0xe8862f, pants:0x3a3230, hair:0x1f1a1a, skin:0xfff4ec, sign:{text:'새마을', cls:'saemaul'}, cat:[0x9a9a9a,0x6f6f6f] },
    { label:'유담이 엄마', role:'mom', shirt:0xffc98a, pants:0xffc98a, hair:0x5a3825, cat:[0xffb347,0xe0822a] },
    { label:'유담', name:'유담', role:'son', age:'toddler', shirt:0x7ed957, pants:0x3d4f8a, hair:0x8a5a36, skin:0xfff4ec } ]},
];

try { await Promise.race([document.fonts.load('16px Jua'), new Promise(r=>setTimeout(r,1500))]); } catch(e){}

// ---------- 기본 세팅 ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
let viewSize = 30;
const camera = new THREE.OrthographicCamera(-1,1,1,-1,1,1500);
const CAM_OFFSET = new THREE.Vector3(0,48,72);
const camTarget = new THREE.Vector3(-34.5,0,-2);

let viewEff = 30, cssW = innerWidth, cssH = innerHeight;
function resize(){
  cssW = innerWidth; cssH = innerHeight;
  renderer.setSize(cssW, cssH);
  const a = cssW/cssH;
  viewEff = Math.max(viewSize, 26/a);   // 세로 화면(모바일)에서도 옆이 충분히 보이게
  camera.left = -viewEff*a/2; camera.right = viewEff*a/2;
  camera.top = viewEff/2; camera.bottom = -viewEff/2;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const hemi = new THREE.HemisphereLight(0xffffff, 0xb5dc9c, 0.48);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dc, 0.55);
sun.position.set(30,70,40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left:-70, right:70, top:70, bottom:-70, near:1, far:200 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);

// ---------- 도우미 (부드러운 카툰 재질) ----------
const GRAD = (()=>{ // 3단계 카툰 명암
  const d = new Uint8Array([150,150,150,255, 210,210,210,255, 255,255,255,255]);
  const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const matCache = {};
function mat(c){ return matCache[c] || (matCache[c] = new THREE.MeshToonMaterial({ color:c, gradientMap:GRAD })); }
function toon(opt){ return new THREE.MeshToonMaterial(Object.assign({ gradientMap:GRAD }, opt)); }
const G = { box:new THREE.BoxGeometry(1,1,1), sph:new THREE.SphereGeometry(1,28,18), cyl:new THREE.CylinderGeometry(1,1,1,24) };
function mesh(geo, material, x,y,z, parent, cast=true){
  const m = new THREE.Mesh(geo, material); m.position.set(x,y,z);
  m.castShadow = cast; m.receiveShadow = true; (parent||scene).add(m); return m;
}
function box(w,h,d,c,x,y,z,parent,opts={}){
  const m = mesh(G.box, opts.material || mat(c), x,y,z, parent, opts.cast !== false);
  m.scale.set(w,h,d); return m;
}
function ball(r,c,x,y,z,parent,sx=1,sy=1,sz=1,material,cast=true){

function facade(fam, kind){

    for(let f=1; f<FL; f++) wins.push({x:tw/2-6,y:20+f*14,w:12,h:9,day:rnd()<.2,night:rnd()<.7});
  } else {
    for(let f=0; f<FL; f++) for(let i=0;i<4;i++) wins.push({x:8+i*24,y:20+f*14,w:18,h:9,day:rnd()<.28,night:rnd()<.72,bar:true});
    for(const x of kind==='front'?[8,80]:[8,44,80]) wins.push({x,y:gy+4,w:16,h:8,day:false,night:true});
  }

    g.fillStyle = night ? '#000' : fam.wall; g.fillRect(0,0,tw,th);

      if(kind!=='side') for(let f=0; f<FL; f++){ g.globalAlpha=.35; g.fillStyle = fam.color; rrect(g,2,20+f*14+10,tw-4,2.2,1); g.globalAlpha=1; }

      g.fillStyle='#ffffff'; rrect(g,w.x-1,w.y-1,w.w+2,w.h+2,2);
      g.fillStyle = w.day ? '#ffe7a0' : '#bfe4fb'; rrect(g,w.x,w.y,w.w,w.h,1.5);

}

const charMats = new Map();
function cm(c, side){
  const key = c + (side?'s':'');
  if(charMats.has(key)) return charMats.get(key);
  const m = toon({ color:c, side: side ? THREE.DoubleSide : THREE.FrontSide });
  m.userData.base = new THREE.Color(c); charMats.set(key, m); return m;
}
function jerseyCM(){
  if(charMats.has('jersey')) return charMats.get('jersey');
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#1f5fbf'; g.fillRect(0,0,512,256);
  g.fillStyle = '#ffd23f'; g.fillRect(0,0,512,26); g.fillRect(0,236,512,20);
  g.fillStyle = '#ffffff'; g.fillRect(118,26,20,210); g.fillRect(374,26,20,210);   // 옆 줄
  g.font = 'bold 120px Jua, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 10; g.strokeStyle = '#ffd23f';
  [0,512].forEach(x=>{ g.strokeText('10', x, 138); g.fillText('10', x, 138); });  // 앞 번호 (이음새 양쪽)
  g.strokeText('10', 256, 138); g.fillText('10', 256, 138);                            // 등 번호
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const m = toon({ map:t, emissiveMap:t }); m.userData.base = new THREE.Color(0xffffff); charMats.set('jersey', m); return m;
}
function stripeCM(a,b,n){
  const key = 'st'+a+b+n; if(charMats.has(key)) return charMats.get(key);
  const c = document.createElement('canvas'); c.width = 4; c.height = n*2; const g = c.getContext('2d');
  for(let i=0;i<n*2;i++){ g.fillStyle = i%2?b:a; g.fillRect(0,i,4,1); }
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter;
  const m = toon({ map:t, emissiveMap:t }); m.userData.base = new THREE.Color(0xffffff); charMats.set(key, m); return m;
}
const whiteShine = new THREE.MeshBasicMaterial({ color:0xffffff });
function limb(r, len, material, x,y,z, parent){
  const p = new THREE.Group(); p.position.set(x,y,z); parent.add(p);
  tube(r, len, 0, 0,-len/2,0, p, material); ball(r,0,0,-len,0,p,1,1,1,material); ball(r,0,0,0,0,p,1,1,1,material);
  return p;
}
function addCat(head, hr, colors){

  const cM = cm(c), sM = cm(st);
  ball(0.3,0,0,cy+0.12,-0.08,g,0.85,0.6,1.2,cM);                      // 몸
  ball(0.12,0,0,cy+0.28,-0.12,g,1.6,0.35,0.5,sM); ball(0.12,0,0,cy+0.27,0.12,g,1.6,0.35,0.5,sM);
  ball(0.24,0,0,cy+0.24,0.3,g,1.05,0.95,1,cM);                         // 머리
  [-1,1].forEach(sd=>{
    const e = mesh(new THREE.ConeGeometry(0.08,0.16,12), cM, sd*0.14,cy+0.47,0.3, g); e.rotation.z = -sd*0.25;
    ball(0.035,0x2a2020,sd*0.085,cy+0.27,0.52,g);                     // 눈
    ball(0.075,0,sd*0.12,cy-0.02,0.42,g,1,0.7,1.2,cM);                  // 앞발
  });
  ball(0.03,0xff8fa3,0,cy+0.2,0.54,g);
  const tail = new THREE.Group(); tail.position.set(0,cy+0.15,-0.42); g.add(tail);
  const tl = tube(0.05,0.45,0,0,0.08,-0.2,tail,sM); tl.rotation.x = -1.2; ball(0.06,0,0,0.16,-0.42,tail,1,1,1,sM);
  g.traverse(o=>{ o.userData.cat = true; });
  return tail;
}

const Sound = { ctx:null, on:true, step:0, next:0 };

  77,0,81,0,84,0,   84,86,84,0,79,0,   81,0,77,0,74,0,   77,79,81,0,0,0,

function toyPiano(m, t, vol){ tone(m, t, 0.4, 'triangle', vol); tone(m+12, t, 0.12, 'sine', vol*0.35); }
function ensureAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  if(Sound.ctx){ if(Sound.ctx.state==='suspended') Sound.ctx.resume(); return; }
  const c = Sound.ctx = new AC();
  Sound.master = c.createGain(); Sound.master.gain.value = Sound.on ? 0.45 : 0; Sound.master.connect(c.destination);
  Sound.music = c.createGain(); Sound.music.gain.value = 0.55; Sound.music.connect(Sound.master);
  Sound.sfx = c.createGain(); Sound.sfx.gain.value = 0.8; Sound.sfx.connect(Sound.master);
  const nb = c.createBuffer(1, c.sampleRate*0.2, c.sampleRate), d = nb.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  Sound.noise = nb;
  Sound.next = c.currentTime + 0.1;
  setInterval(schedule, 30);
}
function tone(m, t, dur, type, vol, dest, glide){
  const c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(mtof(m), t);
  if(glide) o.frequency.exponentialRampToValueAtTime(mtof(glide), t+dur*0.8);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(dest || Sound.music); o.start(t); o.stop(t+dur+0.05);
}
function hat(t, vol){
  const c = Sound.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = Sound.noise; f.type='highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
  s.connect(f); f.connect(g); g.connect(Sound.music); s.start(t); s.stop(t+0.06);

function schedule(){
  const c = Sound.ctx;
  if(Sound.next < c.currentTime) Sound.next = c.currentTime + 0.05;
  while(Sound.next < c.currentTime + 0.15){
    const t = Sound.next, s = Sound.step % 64, e = s % 8, ch = CHORDS[Math.floor(s/8)%4];
    if(Sound.party){ // 댄스 파티!
      const m = PARTY_MEL[s]; if(m) tone(m+12, t, 0.14, 'square', 0.04);
      tone(e%2 ? ch[0]+12 : ch[0], t, 0.14, 'triangle', 0.14);
      hat(t, 0.03); if(e%4===0) tone(36, t, 0.12, 'sine', 0.2, Sound.music, 30);
      Sound.next += 0.16;
    } else if(!night){
      const s6 = Sound.step % 48, e6 = s6 % 6, chd = DAY_CH[Math.floor(s6/6)];
      const m = DAY_MEL[s6]; if(m) toyPiano(m, t, 0.07);                       // 장난감 피아노 멜로디
      if(e6===2 || e6===4){ tone(chd[1]+12, t, 0.14, 'triangle', 0.032); tone(chd[2]+12, t, 0.14, 'triangle', 0.028); hat(t, 0.012); } // 쿵짝짝의 '짝짝'
      if(e6===0) tone(chd[0]+24, t, 0.7, 'sine', 0.028);                         // 마디 첫 박 은은한 종소리
      Sound.next += 0.2;
    } else {
      const arp = [0,1,2,1,0,2,1,2][e];
      tone(ch[arp]+24, t, 1.0, 'sine', 0.06);
      if(e===0) tone(ch[0], t, 2.6, 'sine', 0.09);
      if(e===0 && Math.floor(s/8)%2===0) tone(ch[2]+36, t, 1.4, 'triangle', 0.025);
      Sound.next += 0.38;
    }
    Sound.step++;

}
function sfx(kind){
  if(!Sound.ctx || !Sound.on) return;
  const t = Sound.ctx.currentTime + 0.01, o = Sound.sfx;
  if(kind==='wave'){ [84,88,91].forEach((m,i)=>tone(m, t+i*0.09, 0.16, 'square', 0.04, o)); }
  if(kind==='greet'){ tone(79, t, 0.5, 'triangle', 0.14, o); tone(76, t+0.25, 0.7, 'triangle', 0.14, o); }
  if(kind==='play'){ [72,76,79,84,88,84,88].forEach((m,i)=>tone(m, t+i*0.07, 0.12, 'square', 0.035, o)); }
  if(kind==='jump'){ tone(62, t, 0.2, 'square', 0.04, o, 79); }
  if(kind==='meow'){ tone(83, t, 0.32, 'triangle', 0.1, o, 76); tone(86, t+0.35, 0.4, 'triangle', 0.09, o, 78); }
  if(kind==='quack'){ tone(52, t, 0.12, 'square', 0.07, o, 47); tone(52, t+0.15, 0.14, 'square', 0.07, o, 46); }
  if(kind==='rustle'){ hat(t, 0.08); hat(t+0.08, 0.06); hat(t+0.16, 0.05); tone(64, t+0.35, 0.18, 'sine', 0.1, o, 52); }
  if(kind==='coin'){ tone(88, t, 0.08, 'square', 0.05, o); tone(93, t+0.08, 0.4, 'square', 0.05, o); }
  if(kind==='star'){ [96,93,91,88,84,81].forEach((m,i)=>tone(m, t+i*0.08, 0.5, 'sine', 0.06, o)); }
  if(kind==='giant'){ tone(45, t, 0.7, 'square', 0.06, o, 69); }
  if(kind==='egg'){ [72,76,79,84,79,84].forEach((m,i)=>tone(m, t+0.5+i*0.1, 0.25, 'triangle', 0.1, o)); }
  if(kind==='seesaw'){ [72,79,72,79].forEach((m,i)=>tone(m, t+i*0.16, 0.14, 'triangle', 0.1, o)); }
  if(kind==='love'){ [76,79,84,88,91].forEach((m,i)=>tone(m, t+i*0.1, 0.35, 'sine', 0.1, o)); }
  if(kind==='swing'){ tone(67, t, 0.4, 'triangle', 0.1, o, 84); tone(84, t+0.35, 0.4, 'triangle', 0.08, o, 72); }

function meet(a, b){

    setAct(first, 'love', 2.8, first===a?fa:fb, loveLine(first, second));

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  ndc.set(e.clientX/cssW*2-1, -(e.clientY/cssH)*2+1);
  ray.setFromCamera(ndc, camera);
  const ph = ray.intersectObjects([...people.map(p=>p.root), ...ducks, ...treeGroups], true)[0];
  if(ph){ const u = ph.object.userData;
    if(u.cat) return { cat: u.person };
    if(u.person) return { person: u.person };
    if(u.duck) return { duck: u.duck };
    if(u.tree) return { tree: u.tree };
  }
  const bh = ray.intersectObjects(buildings.map(b=>b.grp), true)[0];
  if(bh) return { building: bh.object.userData.building };
  return null;
}
const joy = { active:false, x:0, y:0 }, joyEl = document.getElementById('joy'), knobEl = document.getElementById('knob');
const pointers = new Map(); let pinchD = 0, down = null;
function joyEnd(){ joy.active = false; joy.x = joy.y = 0; joyEl.classList.remove('on'); knobEl.style.transform = ''; }
canvas.addEventListener('pointerdown', e=>{
  ensureAudio();
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size >= 2){ joyEnd(); down = null; const [a,b] = [...pointers.values()]; pinchD = Math.hypot(a.x-b.x, a.y-b.y); return; }
  down = { id:e.pointerId, x:e.clientX, y:e.clientY, moved:false, clientX:e.clientX, clientY:e.clientY, long:false };
  const hp = pick(down); const who = hp && (hp.person || hp.cat);
  if(who){ const d = down; d.timer = setTimeout(()=>{ if(down===d && !d.moved){ d.long = true; makeGiant(who); } }, 800); }
});
canvas.addEventListener('pointermove', e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size >= 2){
    const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchD>0 && d>0) zoomBy(pinchD/d);
    pinchD = d; return;
  }
  if(down && e.pointerId===down.id){
    const dx = e.clientX-down.x, dy = e.clientY-down.y;
    if(!down.moved && Math.hypot(dx,dy) > 12){ down.moved = true; clearTimeout(down.timer); joy.active = true; joyEl.style.left = down.x+'px'; joyEl.style.top = down.y+'px'; joyEl.classList.add('on'); }
    if(joy.active){
      const Rj = 55; let jx = dx/Rj, jy = dy/Rj; const L = Math.hypot(jx,jy); if(L>1){ jx/=L; jy/=L; }
      joy.x = jx; joy.y = jy;
      knobEl.style.transform = `translate(${jx*36}px,${jy*36}px)`;
    }
  } else if(e.pointerType==='mouse' && !down){
    canvas.style.cursor = pick(e) ? 'pointer' : 'default';
  }
});
function pointerEnd(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinchD = 0;
  if(down && e.pointerId===down.id){
    const d = down, wasTap = !down.moved && !down.long; clearTimeout(d.timer); down = null; joyEnd();
    if(wasTap && e.type==='pointerup') onTap(d);
  }
}

function sitRide(p, st){
  st.occupant = p; p.ride = st; p.vy = 0;
  const lines = st.kind==='swing' ? ['신난다~!','슝~ 슝~','더 높이!'] : ['쿵덕쿵덕~','올라간다~!','내려간다~!'];

}
function leaveRide(p){
  const st = p.ride; st.occupant = null; p.ride = null;

}
// ---------- 움직임 ----------
const UP = new THREE.Vector3(0,0,-1), RIGHT = new THREE.Vector3(1,0,0);
const R = 1.3;
function blocked(x,z){
  if(Math.abs(x)>49.3 || z>35.3 || z<TZ0-1.3) return true;
  for(const c of colliders) if(x>c.x0-R && x<c.x1+R && z>c.z0-R && z<c.z1+R) return true;
  return false;
}
function angleLerp(a,b,t){ const d = ((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }
const tmp = new THREE.Vector3();

resize();
document.getElementById('loading').remove();

let lastSignFs = 0;
const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  nightK += ((night?1:0) - nightK) * Math.min(1, dt*2.5);
  skyCol.copy(DAY_SKY).lerp(NIGHT_SKY, nightK);
  document.body.style.background = partyT>0 ? `hsl(${(t*140)%360},75%,${78-nightK*30}%)` : skyCol.getStyle();
  if(partyT>0){ partyT -= dt; confettiT -= dt;
    if(confettiT<=0){ confettiT = 0.12; const q = people[Math.floor(Math.random()*people.length)]; spawnFx(q, ['🎉','✨','★','♪','🎈'][Math.floor(Math.random()*5)]); }
    if(partyT<=0){ Sound.party = false; } }
  starsEl.style.opacity = nightK; cloudsEl.style.opacity = 1-nightK*0.8; sunEl.style.opacity = 1-nightK; moonEl.style.opacity = nightK;
  sunEl.style.pointerEvents = nightK<0.5 ? 'auto' : 'none'; moonEl.style.pointerEvents = nightK>=0.5 ? 'auto' : 'none';
  hemi.intensity = 0.48 - 0.22*nightK;
  hemi.color.setRGB(1-0.35*nightK, 1-0.3*nightK, 1);
  sun.intensity = 0.55 - 0.33*nightK;
  sun.color.setRGB(1-0.4*nightK, 0.94-0.2*nightK, 0.82+0.18*nightK);
  nightMats.forEach(m=> m.emissiveIntensity = nightK);
  lampMat.emissiveIntensity = nightK;
  lampLights.forEach(l=> l.intensity = 1.4*nightK);
  glowMat.opacity = nightK*0.8;
  charMats.forEach(m=>{ if(m.map) m.emissive.setScalar(0.5*nightK); else m.emissive.copy(m.userData.base).multiplyScalar(0.5*nightK); });
  treeGroups.forEach(g=>{ if(g.userData.shake>0){ g.userData.shake -= dt; g.rotation.z = g.userData.shake>0 ? Math.sin(t*40)*0.07*g.userData.shake : 0; } });
  ducks.forEach(d=>{ const a = t*0.35 + d.userData.ph; d.userData.hop = Math.max(0, d.userData.hop - dt); d.position.set(POND.x+Math.cos(a)*3, Math.sin(d.userData.hop/0.6*Math.PI)*1.6, POND.z+Math.sin(a)*2.2); d.rotation.y = Math.atan2(-Math.cos(a)*2.2, -Math.sin(a)*3); });
  fireflyMat.opacity = nightK*0.9;
  fireflies.forEach(f=>{ const u=f.userData;
    f.position.set(u.x+Math.sin(t*0.7+u.ph)*1.2, u.y+Math.sin(t*1.3+u.ph)*0.4, u.z+Math.cos(t*0.6+u.ph)*1.2);
    f.visible = nightK>0.02 && Math.sin(t*3+u.ph) > -0.3; });

  rideSeats.forEach(st=>{
    if(st.kind!=='swing') return;
    const target = st.occupant ? (reduced?0.35:0.75)*Math.sin(t*2.4 + st.ph) : Math.sin(t*1.2 + st.ph)*0.06;
    st.angle += (target - st.angle) * Math.min(1, dt*6);
    st.pivot.rotation.x = st.angle;
    st.pivot.updateMatrixWorld(true);
  });
  { // 시소: 한 명이면 그쪽으로 내려가고, 두 명이면 쿵덕쿵덕
    const L = rideSeats.find(r=>r.kind==='seesaw'&&r.side<0).occupant, Rr = rideSeats.find(r=>r.kind==='seesaw'&&r.side>0).occupant;
    const target = L && Rr ? Math.sin(t*2.2)*(reduced?0.12:0.26) : L ? 0.26 : Rr ? -0.26 : 0.26;
    SS.angle += (target - SS.angle) * Math.min(1, dt*4);
    SS.pivot.rotation.z = SS.angle; SS.pivot.updateMatrixWorld(true);
  }

  people.forEach((p,i)=>{
    let moving = false;
    if(i===current){
      const v = new THREE.Vector3();
      if(keys.u) v.add(UP); if(keys.d) v.sub(UP);
      if(keys.r) v.add(RIGHT); if(keys.l) v.sub(RIGHT);
      let mag = 1;
      if(joy.active && Math.hypot(joy.x, joy.y) > 0.2){ v.addScaledVector(RIGHT, joy.x).addScaledVector(UP, -joy.y); mag = Math.min(1, Math.hypot(joy.x, joy.y)*1.15); }
      if(p.ride && v.lengthSq()>0) leaveRide(p);
      if(!p.ride && v.lengthSq()>0){
        v.normalize(); moving = true;
        const sp = (p.age==='toddler'?9.5 : p.age==='kid'?12.5 : 11.5)*dt*mag;
        const nx = p.x + v.x*sp, nz = p.z + v.z*sp;
        if(!blocked(nx,p.z)) p.x = nx;
        if(!blocked(p.x,nz)) p.z = nz;
        p.root.rotation.y = angleLerp(p.root.rotation.y, Math.atan2(v.x,v.z), Math.min(1,dt*14));
      }
      if(!p.ride && (p.y>0 || p.vy>0)){ p.y += p.vy*dt; p.vy -= 40*dt; if(p.y<0){ p.y=0; p.vy=0; } }
      // 아이가 그네·시소에 가면 탄다
      if(p.child && !p.ride){
        let far = true;
        rideSeats.forEach(st=>{
          const d = Math.hypot(p.x-st.zx, p.z-st.zz);
          if(d < 3) far = false;
          if(d < 1.8 && !st.occupant && !p.swingBlock && p.y<=0.01 && !p.ride) sitRide(p, st);
        });
        if(far) p.swingBlock = false;
      }
    }
    p.walk += ((moving?1:0) - p.walk) * Math.min(1, dt*10);
    if(moving) p.phase += dt*(p.age==='toddler'?15:11);
    const sw = Math.sin(p.phase)*0.7*p.walk;
    let aLx=-sw, aRx=sw, aLz=0, aRz=0, bow=0, hop=0, roll=0;
    if(p.y>0){ aLz=-0.6; aRz=0.6; }
    if(p.age==='toddler') roll = Math.sin(p.phase)*0.14*p.walk;

    const a = p.act;
    if(a){
      a.t += dt; const k = a.t/a.dur;
      if(k>=1){ p.act = null; p.bubble.classList.remove('show'); }
      else {
        if(!moving && !p.ride && a.type!=='dance') p.root.rotation.y = angleLerp(p.root.rotation.y, a.face, Math.min(1,dt*8));
        if(a.type==='wave'){
          aRx = 0; aRz = 2.7 + Math.sin(a.t*14)*0.4;
          if(p.child) aLz = -0.3;
        } else if(a.type==='greet'){
          bow = Math.sin(Math.min(1, k*1.6)*Math.PI) * 0.6;
          aLx = aRx = bow*0.5;
        } else if(a.type==='love' && a.t>=0){
          aLx = aRx = -1.35; aLz = -0.35 - Math.sin(a.t*6)*0.12; aRz = 0.35 + Math.sin(a.t*6)*0.12;

        } else if(a.type==='dance' && !p.ride){
          const b = a.t*8 + a.off;
          hop = Math.abs(Math.sin(b))*1.0;
          aLx = aRx = 0; aLz = -1.6 - Math.sin(b)*1.1; aRz = 1.6 - Math.sin(b)*1.1;
          if(!moving) p.root.rotation.y = CAM_FACE + Math.sin(a.t*3 + a.off)*0.9 + (Math.floor(a.t/2.5)%2 ? (a.t%2.5)/2.5*Math.PI*2 : 0);
          roll = Math.sin(b)*0.12;
        } else if(a.type==='play'){
          hop = Math.abs(Math.sin(a.t*7 + a.off)) * 1.1;
          aLx = aRx = 0;
          aLz = -2.5 - Math.sin(a.t*14)*0.35; aRz = 2.5 + Math.sin(a.t*14+1)*0.35;
          if(k>0.35 && k<0.6 && !moving && !p.ride) p.root.rotation.y = a.face + (k-0.35)/0.25*Math.PI*2;
          a.emit -= dt; if(a.emit<=0){ spawnFx(p); a.emit = 0.28; }
        }
      }
    }
    let lL = sw, lR = -sw, swingTilt = 0;
    if(p.ride){
      const st = p.ride;
      st.mesh.getWorldPosition(tmp);
      roll = 0; hop = 0; aLz = aRz = 0;
      if(st.kind==='swing'){
        const kick = Math.sin(t*2.4 + st.ph);
        lL = lR = -1.45 + kick*0.35;
        aLx = aRx = -2.85; bow = -st.angle*0.35;
        p.x = tmp.x; p.z = tmp.z - 0.15; p.y = tmp.y + 0.1 - p.hipH*p.sk;
        p.root.rotation.y = 0; swingTilt = st.angle*0.9;
      } else {
        const low = -SS.angle*st.side;           // 내 쪽이 내려가 있으면 +
        lL = lR = -1.35 + Math.max(0, low)*1.6;  // 땅을 박차는 다리
        aLx = aRx = -1.35; bow = low*0.4;
        p.x = tmp.x - st.side*0.15; p.z = tmp.z; p.y = tmp.y + 0.12 - p.hipH*p.sk;
        p.root.rotation.y = st.side<0 ? Math.PI/2 : -Math.PI/2;
      }
      p.swingFx = (p.swingFx||0) - dt; if(p.swingFx<=0){ spawnFx(p); p.swingFx = 0.8; }
    }
    p.root.rotation.x = swingTilt;
    p.legL.rotation.x = lL; p.legR.rotation.x = lR;
    p.armL.rotation.x = aLx; p.armR.rotation.x = aRx;
    p.armL.rotation.z = aLz; p.armR.rotation.z = aRz;
    p.upper.rotation.x = bow;
    p.inner.rotation.z = roll;
    if(p.ponytail) p.ponytail.rotation.x = Math.sin(p.phase*2)*0.25*p.walk + (reduced?0:Math.sin(t*2+i)*0.05);
    if(p.ball){
      const fx = Math.sin(p.root.rotation.y), fz = Math.cos(p.root.rotation.y), br2 = 0.62*p.sk;
      const tx = p.x + fx*1.9*p.sk, tz = p.z + fz*1.9*p.sk;
      const dx = (tx - p.ball.position.x)*Math.min(1, dt*9), dz = (tz - p.ball.position.z)*Math.min(1, dt*9);
      p.ball.position.x += dx; p.ball.position.z += dz; p.ball.position.y = br2; p.ball.scale.setScalar(p.sk);
      const dist = Math.hypot(dx,dz); if(dist>1e-4){ tmp.set(dz,0,-dx).normalize(); p.ball.rotateOnWorldAxis(tmp, dist/br2); }
    }
    if(p.catTail) p.catTail.rotation.y = reduced ? 0 : Math.sin(t*(p.catHappy>0?14:3)+i)*(p.catHappy>0?0.9:0.6);

    // 인사 등이 끝나고 잠시 뒤 정면(화면 쪽)을 바라봄
    if(moving || p.act || p.ride || i===current && (keys.u||keys.d||keys.l||keys.r||joy.active)) p.idleT = 0;
    else { p.idleT = (p.idleT||0) + dt; if(p.idleT > 2.5) p.root.rotation.y = angleLerp(p.root.rotation.y, CAM_FACE, Math.min(1, dt*4)); }
    // 거인 이스터에그
    if(p.giantT>0) p.giantT -= dt;
    p.sk += ((p.giantT>0 ? 1.9 : 1) - p.sk) * Math.min(1, dt*4);
    p.root.scale.setScalar(CHAR * p.sk);
    const bob = moving ? Math.abs(Math.sin(p.phase))*0.22 : 0;
    p.root.position.set(p.x, p.y + (p.ride ? 0 : bob + (reduced?hop*0.3:hop)), p.z);
  });

  for(let i=0;i<people.length;i++) for(let j=i+1;j<people.length;j++){
    const key = pairKey(i,j), d = Math.hypot(people[i].x-people[j].x, people[i].z-people[j].z);
    if(d < MEET_IN && !nearSet.has(key)){ nearSet.add(key); meet(people[i], people[j]); }
    else if(d > MEET_OUT) nearSet.delete(key);
  }

  const me = people[current];
  camTarget.lerp(tmp.set(me.x, 0, me.z), Math.min(1, dt*5));
  camera.position.copy(camTarget).add(CAM_OFFSET);
  camera.lookAt(camTarget);

  marker.visible = !me.sign;
  marker.position.set(me.x, me.y + me.height*me.sk + 1.6 + (reduced?0:Math.sin(t*5)*0.15), me.z);
  marker.rotation.y = t*2;
  ring.position.set(me.x, 0.05, me.z);

  ray.set(camera.position, tmp.set(me.x, me.y+1, me.z).sub(camera.position).normalize());
  const hits = new Set(ray.intersectObjects(buildings.map(b=>b.body)).map(h=>h.object));
  buildings.forEach(b=>{
    const target = hits.has(b.body) ? 0.3 : 1;
    b.opacity += (target - b.opacity) * Math.min(1, dt*8);
    const tr = b.opacity < 0.98;
    b.mats.forEach(m=>{ if(m.transparent!==tr){ m.transparent=tr; m.needsUpdate=true; } m.opacity=b.opacity; });
  });

  renderer.render(scene, camera);

  const w = cssW, h = cssH;
  const scr = (x,y,z)=>{ tmp.set(x,y,z).project(camera); return [(tmp.x+1)/2*w, (1-tmp.y)/2*h]; };
  const put = (el,x,y)=>{ el.style.left = x+'px'; el.style.top = y+'px'; };
  people.forEach((p,i)=>{
    let [tx,ty] = scr(p.x, p.y + p.height*p.sk + (i===current && !p.sign ? 3.2 : 0.4), p.z);
    if(p.sign){
      const [sx,sy] = scr(p.x, p.y + p.signY*p.sk, p.z);
      put(p.sign, sx, sy);
      ty = Math.min(ty, sy - (p.spec.sticker ? 22 : 38));
      if(p.sign2){ put(p.sign2, sx, sy - 32); ty = Math.min(ty, sy - 76); }
    }
    put(p.tag, tx, ty);
    if(p.act) put(p.bubble, tx, ty);
  });
  FAMILIES.forEach(f=>{ const [x,y] = scr(f.pos[0], H+2.4, f.pos[1]); put(f.tag, x, y);
    const [sx,sy] = scr(f.pos[0], H-1, f.pos[1]+D/2+0.02); put(f.sign, sx, sy); });
  { const ppu = h / viewEff, fs = Math.max(9, Math.min(30, Math.round(ppu*1.05)));
    if(fs !== lastSignFs){ lastSignFs = fs; FAMILIES.forEach(f=>{ f.sign.style.fontSize = fs+'px'; }); } }
  PLACES.forEach(pl=>{ const [x,y] = scr(...pl.pos); put(pl.el, x, y); });
  for(let k=particles.length-1;k>=0;k--){
    const q = particles[k]; q.life -= dt; q.y += dt*3;
    if(q.life<=0){ q.el.remove(); particles.splice(k,1); continue; }
    const [x,y] = scr(q.x, q.y, q.z); put(q.el, x, y); q.el.style.opacity = Math.min(1, q.life*2);
  }

  requestAnimationFrame(tick);
}
tick();
})();
</script>
</body>
</html>
